name: Update profile statistics
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_stats.py
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate statistics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/profile_stats.py
      - name: Publish statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          start = s.index("## GitHub activity")
          end = s.index("\n---", start)
          p.write_text(s[:start] + '''## GitHub activity

          <div align="center">

          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="./assets/activity-dark.svg" />
            <img width="100%" alt="GitHub activity and public repository languages" src="./assets/activity-light.svg" />
          </picture>

          </div>
          ''' + s[end:])
          PY
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update profile statistics"
          git push
